project:
  type: website
  output-dir: docs          # GitHub Pages serves from /docs on the main branch
  resources:
    - files/
    - .nojekyll

website:
  title: "Precious Innocent Mastala"
  description: "Veterinarian and One Health epidemiologist working on neglected tropical diseases and zoonoses in Malawi."
  site-url: "https://pmastala.github.io"
  favicon: images/logo.svg
  image: images/social-card.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  navbar:
    title: "Precious Innocent Mastala"
    collapse-below: md
    right:
      - text: About
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: CV
        href: cv.qmd
  page-footer:
    left: "© 2026 Precious Innocent Mastala"
    right:
      - icon: envelope
        href: mailto:preciousmastala@gmail.com
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/precious-innocent-mastala-614235167/
        aria-label: LinkedIn
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=xGpXw3gAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/pmastala
        aria-label: GitHub

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: false
    title-block-style: none
    link-external-newwindow: true
    lang: en-GB
