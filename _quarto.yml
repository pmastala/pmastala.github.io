project:
  type: website
  output-dir: docs          # GitHub Pages serves from /docs on the main branch
  resources:
    - files/
    - .nojekyll

website:
  title: "Precious Innocent Mastala"
  description: "Veterinarian and One Health epidemiologist working on neglected tropical diseases and zoonoses in Malawi."
  site-url: "https://pmastala.github.io"
  favicon: images/logo.svg
  image: images/social-card.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  navbar:
    title: "Precious Innocent Mastala"
    collapse-below: md
    right:
      - text: About
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Publications
        href: publications.qmd
      - text: CV
        href: cv.qmd

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: false
    title-block-style: none
    link-external-newwindow: true
    lang: en-GB
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
    include-after-body: _footer.html
